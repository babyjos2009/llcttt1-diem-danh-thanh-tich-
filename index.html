<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớn Lên Trong Chúa Thánh Thần 1 - Điểm danh</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#173b35;
  background:linear-gradient(135deg,#eafaf3,#eaf3ff);
}

header{
  background:linear-gradient(135deg,#168a70,#2d91c7);
  color:white;
  padding:26px 16px;
  text-align:center;
}

header h1{margin:0 0 8px;font-size:26px}
.quote{opacity:.95}

main{max-width:1000px;margin:24px auto;padding:0 14px}

.card{
  background:white;
  border-radius:17px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 6px 20px #00000010;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{opacity:.65;cursor:wait}

.btn{background:#168a70;color:white}
.btn.red{background:#c94a4a}
.btn.gray{background:#64748b}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:16px;
}

.tabs button{background:white}
.tabs button.active{background:#168a70;color:white}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.stat{
  background:#f3faf7;
  padding:15px;
  border-radius:14px;
  text-align:center;
}

.stat b{display:block;font-size:25px;margin-top:5px}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccdcd7;
  border-radius:10px;
  font-size:16px;
  margin:9px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid #eee;
}

.row:last-child{border:0}
.member-name{font-weight:600}

.badge{
  padding:9px 12px;
  border-radius:9px;
}
.present{background:#d9f6e9;color:#08714e}
.absent{background:#ffe1e1;color:#a62a2a}

.actions{display:flex;gap:7px;flex-wrap:wrap}
.addbox{display:flex;gap:8px}
.addbox input{margin:0}

.small{font-size:13px;color:#64748b}

.session{
  padding:15px;
  border:1px solid #dcebe6;
  border-radius:14px;
  margin:10px 0;
}

.bar,.rank-bar{
  background:#e8eeee;
  border-radius:20px;
  overflow:hidden;
}
.bar{height:10px;margin:9px 0}
.fill{height:100%;background:#168a70}

.competition-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:15px 0;
}

.month-title{text-align:center;font-size:20px;font-weight:800}

.rank-card{
  padding:14px;
  margin:10px 0;
  border:1px solid #e5ecea;
  background:#fbfefd;
  border-radius:15px;
}

.rank-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.rank-name{font-weight:800}
.rank-score{font-size:19px;font-weight:900}
.rank-bar{height:16px;margin:10px 0}
.rank-fill{
  height:100%;
  background:linear-gradient(90deg,#168a70,#2d91c7);
}

.score-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  flex-wrap:wrap;
}

.score-btn{
  padding:8px 11px;
  background:#eef5f2;
  color:#173b35;
}
.score-btn.plus{background:#d9f6e9;color:#08714e}
.score-btn.minus{background:#ffe1e1;color:#a62a2a}

.prize{font-size:13px;font-weight:800;margin-top:5px}
.rank-medal{font-size:22px;margin-right:5px}

.login-page{
  max-width:450px;
  margin:7vh auto;
  padding:26px 22px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 35px #00000016;
}

.login-page h2{color:#168a70;margin:0 0 10px}
.login-page p{color:#64748b;line-height:1.5}
.login-page label{display:block;font-weight:bold;margin-top:13px}
.login-page input{margin:7px 0 0}
.login-page .btn{width:100%;margin-top:16px}

.error{
  display:none;
  margin-top:12px;
  padding:11px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  border-radius:10px;
  color:#a42323;
  background:#fff0f0;
}

#syncStatus{
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:9px;
  max-width:calc(100vw - 24px);
  padding:9px 11px;
  border-radius:12px;
  color:white;
  background:#173b35;
  box-shadow:0 4px 16px #0002;
  font-size:12px;
}

#syncStatus button{padding:7px 10px;background:white;color:#173b35}

@media(max-width:600px){
  header h1{font-size:21px}
  main{margin:15px auto}
  .stats{grid-template-columns:1fr}
  .row{align-items:flex-start;flex-direction:column}
  .addbox{flex-direction:column}
  .competition-nav{flex-direction:column}
  .competition-nav button{width:100%}
  .rank-head{align-items:flex-start}
  .score-actions{justify-content:flex-start}
  .login-page{margin:5vh 13px;padding:22px 16px}
  #syncStatus{left:10px;right:10px;bottom:10px;justify-content:space-between}
}
</style>
</head>

<body>

<!-- DANG NHAP -->
<section id="loginPage" class="login-page">
  <h2>🔐 Đăng nhập quản trị</h2>
  <p>
    Đăng nhập tài khoản quản trị Firebase để sử dụng điểm danh
    và đồng bộ dữ liệu giữa các thiết bị.
  </p>

  <label for="loginEmail">Email</label>
  <input id="loginEmail" type="email"
         autocomplete="username"
         placeholder="Nhập email quản trị">

  <label for="loginPassword">Mật khẩu</label>
  <input id="loginPassword" type="password"
         autocomplete="current-password"
         placeholder="Nhập mật khẩu">

  <button id="loginButton" class="btn" onclick="login()">
    Đăng nhập và đồng bộ
